[project]
name = "rshub-agent"
version = "0.1.0"
description = "Lightweight backend for RSHub web application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "rshub>=0.3.5",
    "jinja2>=3.1.0",
    "openai>=1.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.66.0",
    "filelock>=3.20.3",
    "pillow>=12.0.0",
    "scikit-image>=0.25.2",
    "scienceplots>=2.2.1",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
